# LUCY-ui is a client of the LUCY family, not a family service, so it does not use the family's
# reusable workflow: there is no keyring, no image and no row in repos.txt to check. The bar is
# the same; the assumptions are not. (clyde's CI says the same for the same reason.)
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint, types, unit tests at 100% coverage, build, site checks
        run: npm run check
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: End-to-end against the fake hub, in Chromium, Firefox, WebKit, a phone and reduced motion
        run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
